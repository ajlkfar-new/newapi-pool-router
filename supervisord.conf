[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# New API：强制锁在 3000，仅供容器内池路由调用
[program:new-api]
command=/new-api
directory=/data
environment=PORT="3000"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/new-api.out.log
stderr_logfile=/var/log/new-api.err.log

# 池路由：读 Render 注入的 PORT(=4000) 对外暴露
[program:pool-router]
command=sh -c 'cd /pool && exec python3 -m uvicorn pool_router:app --host 0.0.0.0 --port $PORT'
environment=PORT="4000"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/pool-router.out.log
stderr_logfile=/var/log/pool-router.err.log
